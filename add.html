<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<title>Zi_LINK — Add</title>
<style>
  :root {
    --bg: #000;
    --text: #eee;
    --muted: #999;
    --accent: #999;
    --btn: #222;
    --btn-hover: #444;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden; /* the two panels below scroll internally, the page itself doesn't */
  }

  .layout {
    flex: 1;
    display: flex;
    min-height: 0; /* required so children can scroll instead of overflowing the page */
  }

  .panel {
    color: var(--text);
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .panel h3 {
    font-size: 13px;
    margin: 0 0 12px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: .06em;
  }

  /* ====== Form (right) ====== */
  #formBox {
    width: 420px;
    flex-shrink: 0;
    background: #111;
    border-left: 1px solid #262626;
    padding: 18px 20px;
    overflow-y: auto;
  }

  .modal-field { margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
  .modal-field label { font-size: 12px; color: var(--muted); }
  .modal-field input,
  .modal-field textarea {
    padding: 7px 9px; border-radius: 8px; border: 1px solid #333;
    background: var(--btn); color: var(--text); font-size: 13px;
    font-family: inherit;
  }
  .modal-field textarea {
    resize: both;
    width: 100%;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .modal-field textarea::-webkit-scrollbar { display: none; }

  /* ====== Media box: images + videos merged (left) ====== */
  #mediaBox {
    flex: 1;
    min-width: 0;
    display: flex; flex-direction: column; gap: 6px;
    min-height: 0;
    padding: 16px 20px;
  }
  .media-divider {
    border: none; border-top: 1px solid #2a2a2a;
    margin: 2px 0; flex-shrink: 0;
  }
  .picker-status { font-size: 12px; color: var(--muted); margin: -6px 0 2px; flex-shrink: 0; }

  .scroll-wrap {
    position: relative;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .scroll-wrap.images { flex: 1; }

  .scroll-hint {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: var(--muted);
    background: #111;
    padding: 1px 8px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .15s;
    z-index: 2;
  }
  .scroll-hint.top { top: -1px; border-radius: 0 0 8px 8px; }
  .scroll-hint.bottom { bottom: -1px; border-radius: 8px 8px 0 0; }
  .scroll-hint.visible { opacity: 1; }

  /* horizontal-scroll wrapper + hints, used by the single-row video strip */
  .scroll-wrap-h { position: relative; flex-shrink: 0; }
  .scroll-hint-h {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    color: var(--muted);
    background: #111;
    padding: 2px 4px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .15s;
    z-index: 2;
    border-radius: 6px;
  }
  .scroll-hint-h.left { left: -1px; border-radius: 0 8px 8px 0; }
  .scroll-hint-h.right { right: -1px; border-radius: 8px 0 0 8px; }
  .scroll-hint-h.visible { opacity: 1; }

  /* grid used for the image thumbnails */
  .thumb-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-auto-rows: min-content;
    gap: 8px;
    padding: 4px;
    border: 1px solid #222;
    border-radius: 8px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    align-content: flex-start;
  }
  .thumb-grid::-webkit-scrollbar { display: none; }

  /* single scrollable row used for video thumbnails */
  .video-row {
    display: flex;
    flex-direction: row;
    gap: 8px;
    padding: 4px;
    border: 1px solid #222;
    border-radius: 8px;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .video-row::-webkit-scrollbar { display: none; }
  .video-row .thumb-opt {
    width: 150px;
    flex-shrink: 0;
  }

  .thumb-opt {
    position: relative; width: 100%; aspect-ratio: 1 / 1; border-radius: 8px;
    overflow: hidden; border: 2px solid #333; cursor: pointer; background: #1a1a1a;
  }
  .thumb-opt img,
  .thumb-opt canvas,
  .thumb-opt video {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .thumb-opt:hover { border-color: #7fd0ff; }
  .thumb-opt.selected { border-color: #9dff9d; box-shadow: 0 0 0 1px #9dff9d inset; }
  .thumb-opt.selected::after {
    content: "✓"; position: absolute; top: 2px; left: 2px;
    background: #2a6f3f; color: #d8ffd8; font-size: 11px;
    width: 16px; height: 16px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    z-index: 3;
  }

  /* fallback tile when a video can't be thumbnailed (tiktok, fb, unknown host, error, etc.) */
  .icon-fallback {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 4px; padding: 6px; text-align: center;
    box-sizing: border-box;
  }
  .icon-fallback .icon { font-size: 26px; }
  .icon-fallback .host { font-size: 9px; color: var(--muted); word-break: break-all; line-height: 1.2; }

  .thumb-opt .play-badge {
    position: absolute; bottom: 3px; right: 3px; font-size: 12px;
    background: rgba(0,0,0,0.55); border-radius: 50%; width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center; z-index: 2;
  }

  /* ====== Text snippets (click to drop into Notes) ====== */
  .text-list {
    display: flex;
    flex-direction: column;
    padding: 4px 2px;
    overflow-y: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .text-list::-webkit-scrollbar { display: none; }
  .text-opt {
    font-size: 13.5px;
    line-height: 1.4;
    padding: 4px 6px;
    color: #f2f2f2;
    cursor: pointer;
    border-bottom: 1px solid #262626;
    white-space: normal;
  }
  .text-opt:last-child { border-bottom: none; }
  .text-opt:hover { background: rgba(127,208,255,0.08); }
  .text-opt.selected { background: rgba(157,255,157,0.10); border-bottom-color: #2a6f3f; }

  /* ====== Collapsible Videos / Text sections ====== */
  .collapsible-section {
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    gap: 4px;
  }
  .collapsible-section.expanded { min-height: 0; }
  #videoSection.expanded { flex-shrink: 0; }
  #imagesSection.expanded { flex: 1; min-height: 150px; }
  #textSection.expanded { flex: 1; min-height: 100px; }
  .section-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    text-align: left;
    background: #141414;
    border: 1px solid #262626;
    border-radius: 6px;
    padding: 4px 8px;
    color: var(--text);
    font-size: 11px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .section-toggle:hover { border-color: #7fd0ff; }
  .toggle-arrow { font-size: 10px; color: var(--muted); width: 10px; }
  .toggle-label { font-weight: bold; }
  .toggle-count { margin-left: auto; color: var(--muted); font-size: 11px; }
  .section-body {
    display: none;
    flex-direction: column;
    min-height: 0;
  }
  .collapsible-section.expanded .section-body {
    display: flex;
    flex: 1;
    min-height: 0;
  }
  #videoSection.expanded .section-body { flex: none; }

  .empty-note {
    grid-column: 1 / -1;
    font-size: 12px; color: var(--muted); font-style: italic;
    text-align: center; padding: 10px 0;
  }

  /* ====== Type chips ====== */
  .modal-chip-add-row { display: flex; gap: 6px; margin-top: 2px; }
  .modal-chip-add-row input {
    flex: 1; padding: 5px 8px; border-radius: 8px; border: 1px solid #333;
    background: var(--btn); color: var(--text); font-size: 12px;
  }
  .modal-chip-add-row button {
    padding: 5px 10px; border-radius: 8px; border: 1px solid #444;
    background: var(--btn); color: var(--text); font-size: 12px;
    cursor: pointer; white-space: nowrap;
  }
  .modal-chip-add-row button:hover { border-color: #7fd0ff; }

  .modal-chip-picker { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 2px; }
  .modal-chip {
    font-size: 12px; padding: 3px 10px; border-radius: 12px;
    border: 1px solid #444; background: var(--btn); color: var(--muted);
    cursor: pointer; user-select: none;
  }
  .modal-chip:hover { border-color: #7fd0ff; }
  .modal-chip.selected {
    background: rgba(157,255,157,0.15); border-color: #9dff9d;
    color: #d8ffd8; font-weight: bold;
  }
  .modal-chip-empty { font-size: 12px; color: var(--muted); font-style: italic; }

  /* ====== Stars ====== */
  .modal-star-picker { display: flex; gap: 4px; font-size: 22px; line-height: 1; }
  .modal-star { cursor: pointer; color: #444; }
  .modal-star.filled { color: #ffd75e; }

  #rateField { margin-bottom: 0; }
  .modal-msg { font-size: 12px; min-height: 14px; margin-top: 4px; }

  .modal-actions {
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px; margin-top: 14px;
  }
  .modal-actions-right { display: flex; gap: 8px; margin-left: auto; }
  .modal-actions button {
    padding: 7px 14px; border-radius: 10px; border: 1px solid #333;
    background: var(--btn); color: var(--text); font-size: 13px; cursor: pointer;
  }
  .modal-actions button:hover { background: var(--btn-hover); }
  .clear-btn { background: transparent; border: 1px solid #555; color: var(--muted); }
  .clear-btn:hover { border-color: #ff8080; color: #ff8080; }
  .save-btn { background: #2a6f3f; border-color: #2a6f3f; }
  .save-btn:hover { background: #348a4e; }

  @media (max-width: 900px) {
    body { overflow: auto; }
    .layout { flex-direction: column; }
    #formBox { width: 100%; border-left: none; border-top: 1px solid #262626; overflow-y: visible; }
    #mediaBox { flex: none; }
  }
  .gear { background:transparent; border:1px solid #333; border-radius:8px; color:var(--muted); cursor:pointer; padding:1px 8px; font-size:13px; }
  .gear:hover { border-color:#7fd0ff; }
</style>
</head>
<body>
  <div class="layout">

    <!-- Media: images + videos -->
    <div id="mediaBox" class="panel">
      <h3>Media</h3>

      <div id="imagesSection" class="collapsible-section expanded">
        <button type="button" class="section-toggle" id="imagesToggleBtn">
          <span class="toggle-arrow">▾</span>
          <span class="toggle-label">Images</span>
          <span class="toggle-count" id="imagesCount"></span>
        </button>
        <div class="section-body" id="imagesBody">
          <div id="pickerStatusImg" class="picker-status"></div>
          <div class="scroll-wrap images">
            <span class="scroll-hint top">▲ more</span>
            <div id="thumbGrid" class="thumb-grid">
              <div class="empty-note">Looking for images…</div>
            </div>
            <span class="scroll-hint bottom">▼ more</span>
          </div>
        </div>
      </div>

      <hr id="mediaDivider" class="media-divider" style="display:none">

      <div id="videoSection" class="collapsible-section" style="display:none">
        <button type="button" class="section-toggle" id="videoToggleBtn">
          <span class="toggle-arrow">▸</span>
          <span class="toggle-label">Videos</span>
          <span class="toggle-count" id="videoCount"></span>
        </button>
        <div class="section-body" id="videoBody">
          <div id="pickerStatusVid" class="picker-status"></div>
          <div class="scroll-wrap-h">
            <span class="scroll-hint-h left">‹</span>
            <div id="videoGrid" class="video-row"></div>
            <span class="scroll-hint-h right">›</span>
          </div>
        </div>
      </div>

      <div id="textSection" class="collapsible-section" style="display:none">
        <button type="button" class="section-toggle" id="textToggleBtn">
          <span class="toggle-arrow">▸</span>
          <span class="toggle-label">Text</span>
          <span class="toggle-count" id="textCount"></span>
        </button>
        <div class="section-body" id="textBody">
          <div id="pickerStatusText" class="picker-status"></div>
          <div id="textList" class="text-list"></div>
        </div>
      </div>
    </div>

    <!-- Add form -->
    <div id="formBox" class="panel">
      <h3 style="display:flex;justify-content:space-between;align-items:center">Add New Card <button type="button" id="openSettingsBtn" class="gear" title="Settings">⚙️</button></h3>

      <div class="modal-field">
        <label>Title</label>
        <textarea id="fldTitle" rows="2"></textarea>
      </div>

      <div class="modal-field">
        <label>Link</label>
        <input id="fldLink" type="text"/>
      </div>

      <div class="modal-field">
        <label>Image</label>
        <input id="fldImage" type="text"/>
      </div>

      <div class="modal-field">
        <label>Vid</label>
        <input id="fldVid" type="text"/>
      </div>

      <div class="modal-field">
        <label>Note</label>
        <textarea id="fldNote" rows="2"></textarea>
      </div>

      <div class="modal-field">
        <label>Type (pick any that apply)</label>
        <div class="modal-chip-add-row">
          <input type="text" id="typeNewInput" placeholder="Add new type…"/>
          <button type="button" id="typeAddBtn">+ Add</button>
        </div>
        <div id="typeChips" class="modal-chip-picker">
          <span class="modal-chip-empty">Loading…</span>
        </div>
      </div>

      <div class="modal-field" id="rateField">
        <label>Rate</label>
        <div id="rateStars" class="modal-star-picker"></div>
      </div>

      <div class="modal-msg" id="msg"></div>

      <div class="modal-actions">
        <button id="clearBtn" type="button" class="clear-btn">Clear</button>
        <div class="modal-actions-right">
          <button id="cancelBtn" type="button">Cancel</button>
          <button id="saveBtn" type="button" class="save-btn">Add</button>
        </div>
      </div>
    </div>

  </div>

  <script src="add.js"></script>
</body>
</html>
